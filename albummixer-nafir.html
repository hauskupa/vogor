      <div class="tm4-header-meta">

          <span class="tm4-counter-label">Counter</span>
          <output class="tm4-counter-readout" data-mixer-counter>000</output>
        </div>
        <div class="tm4-badge tm4-brand" aria-label="TASCAM">TASCAM</div>
      </div>
    </header>

    <div class="tm4-layout">
      <div class="tm4-left">
        <section class="tm4-track-bank">
          <div data-mixer-track-controls></div>
          <section class="tm4-master-strip">
            <div class="tm4-strip-title">Master</div>
            <label class="tm4-master-wrap">
              <span>Level</span>
              <input class="tm4-master-fader" type="range" min="0" max="1" step="0.01" value="0.7" data-mixer-master />
              <output class="tm4-readout" data-mixer-master-value>7.0</output>
            </label>
            <div class="tm4-readout">Bus</div>
          </section>
        </section>
        <template data-mixer-track-template>
          <section class="tm4-strip">
            <div class="tm4-strip-title" data-track-title>Track</div>
            <div class="tm4-strip-controls">
              <label class="tm4-knob" data-control="gain">
                <span>Gain</span>
                <span class="tm4-dial">
                  <input type="range" min="0" max="2" step="0.01" />
                </span>
                <span class="tm4-readout" data-readout="gain">0 dB</span>
              </label>
              <label class="tm4-knob" data-control="eq-high">
                <span>EQ Hi</span>
                <span class="tm4-dial">
                  <input type="range" min="-1" max="1" step="0.01" />
                </span>
                <span class="tm4-readout" data-readout="eq-high">0 dB</span>
              </label>
              <label class="tm4-knob" data-control="eq-low">
                <span>EQ Lo</span>
                <span class="tm4-dial">
                  <input type="range" min="-1" max="1" step="0.01" />
                </span>
                <span class="tm4-readout" data-readout="eq-low">0 dB</span>
              </label>
              <label class="tm4-knob" data-control="pan">
                <span>Pan</span>
                <span class="tm4-dial">
                  <input type="range" min="-1" max="1" step="0.01" />
                </span>
                <span class="tm4-readout" data-readout="pan">C</span>
              </label>
            </div>
            <div class="tm4-meter-panel" data-track-meter>
              <div class="tm4-meter-stack"></div>
            </div>
            <label class="tm4-fader-wrap">
              <span>Level</span>
              <input type="range" min="0" max="1" step="0.01" class="tm4-fader" data-control="level" />
              <span class="tm4-readout" data-readout="level">7.0</span>
            </label>
            <div class="tm4-strip-title" data-track-label>Track</div>
          </section>
        </template>
      </div>
